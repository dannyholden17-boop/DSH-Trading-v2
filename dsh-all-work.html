  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 16px;border-bottom:1px solid var(--panel-brd)}
  td{padding:14px 16px;border-bottom:1px solid var(--panel-brd);font-size:13.5px;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .sym{font-weight:700;font-family:var(--mono)}
  .side-b{color:var(--up);font-weight:650}
  .side-s{color:var(--down);font-weight:650}
  .mono{font-family:var(--mono)}
  .st{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:20px;display:inline-block}

  .st.cancel{background:rgba(255,110,138,.12);color:var(--down);border:1px solid rgba(255,110,138,.26)}
  .x{color:var(--faint);cursor:pointer;font-size:15px}

  @media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}}

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.6;
    font-size: 16px;
    letter-spacing: -0.003em;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

  /* ---- Terminal status header ---- */
  .topbar {
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(6px);
  }
  .topbar-inner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 12px 24px; max-width: 1000px; margin: 0 auto;
    font-family: var(--mono); font-size: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .02em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 3px color-mix(in srgb, var(--up) 22%, transparent); }
  .topbar .meta { color: var(--faint); letter-spacing: .04em; }

  /* ---- Hero ---- */
  header.hero { padding: 64px 0 36px; border-bottom: 1px solid var(--border); }
  .eyebrow {
    font-family: var(--mono); font-size: 12px; letter-spacing: .22em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 20px;
  }
  h1 {
    font-family: var(--mono); font-weight: 600;
    font-size: clamp(30px, 5.4vw, 52px); line-height: 1.04;
    letter-spacing: -0.02em; margin: 0 0 20px; text-wrap: balance;
  }
  h1 .amp { color: var(--accent); }
  .lede { font-size: clamp(17px, 2.2vw, 20px); color: var(--muted); max-width: 62ch; margin: 0; }

  /* ---- Ticker metric row ---- */
  .ticker {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px;
    background: var(--border); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; margin: 36px 0 0;
  }
  .ticker .cell { background: var(--surface); padding: 16px 18px; }
  .ticker .k { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
  .ticker .v { font-family: var(--mono); font-size: clamp(19px, 3vw, 26px); font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .ticker .v.crit { color: var(--down); }
  .ticker .v.ok { color: var(--up); }
  .ticker .v.warn { color: var(--warn); }
  .ticker .sub { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: var(--mono); }

  /* ---- Sections ---- */
  section { padding: 52px 0; border-bottom: 1px solid var(--border); }
  .sec-label {
    font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 6px; display: flex; align-items: center; gap: 10px;
  }
  .sec-label::before { content: &quot;&quot;; width: 22px; height: 1px; background: var(--accent); display: inline-block; }
  h2 { font-family: var(--mono); font-size: clamp(22px, 3.4vw, 30px); font-weight: 600; letter-spacing: -.015em; margin: 0 0 24px; text-wrap: balance; }
  h3 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  p { margin: 0 0 16px; }
  p:last-child { margin-bottom: 0; }
  strong { font-weight: 650; color: var(--text); }
  code { font-family: var(--mono); font-size: .86em; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; color: var(--accent); }

  .callout {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: 10px;
    padding: 22px 24px; box-shadow: var(--shadow);
  }
  .callout.crit { border-left-color: var(--down); }
  .callout p { color: var(--muted); }
  .callout strong { color: var(--text); }

  /* ---- Assessment cards ---- */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
  }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card-head .num { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .grade {
    font-family: var(--mono); font-weight: 700; font-size: 13px;
    padding: 3px 9px; border-radius: 6px; letter-spacing: .02em; white-space: nowrap;
  }
  .grade.good { color: var(--up); background: color-mix(in srgb, var(--up) 14%, transparent); border: 1px solid color-mix(in srgb, var(--up) 30%, transparent); }
  .grade.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }
  .grade.crit { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); border: 1px solid color-mix(in srgb, var(--down) 30%, transparent); }
  .card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .card li { position: relative; padding-left: 20px; font-size: 14.5px; color: var(--muted); }
  .card li::before { content: &quot;&quot;; position: absolute; left: 3px; top: 9px; width: 6px; height: 6px; border-radius: 1px; background: var(--border-strong); }
  .card li.plus::before { background: var(--up); }
  .card li.minus::before { background: var(--down); }
  .card li strong { color: var(--text); font-weight: 600; }

  /* ---- Priority list ---- */
  .prio { display: flex; flex-direction: column; gap: 12px; }
  .prio-row {
    display: grid; grid-template-columns: 76px 1fr; gap: 18px; align-items: start;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px;
  }
  .tier { font-family: var(--mono); font-weight: 700; font-size: 13px; padding: 5px 0; text-align: center; border-radius: 6px; }
  .tier.p0 { color: var(--down); background: color-mix(in srgb, var(--down) 13%, transparent); border: 1px solid color-mix(in srgb, var(--down) 32%, transparent); }
  .tier.p1 { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 32%, transparent); }
  .tier.p2 { color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); }
  .prio-row h3 { font-family: var(--sans); font-size: 15.5px; margin: 0 0 5px; }
  .prio-row p { font-size: 14px; color: var(--muted); margin: 0; }
  .prio-row .files { font-family: var(--mono); font-size: 12px; color: var(--faint); margin-top: 7px; }

  /* ---- Roadmap phases ---- */
  .phases { display: flex; flex-direction: column; gap: 0; }
  .phase {
    display: grid; grid-template-columns: 120px 1fr; gap: 28px;
    padding: 26px 0; border-top: 1px solid var(--border);
  }
  .phase:first-child { border-top: none; }
  .phase-idx { font-family: var(--mono); }
  .phase-idx .n { font-size: 30px; font-weight: 700; color: var(--accent); letter-spacing: -.02em; }
  .phase-idx .t { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-top: 4px; }
  .phase-body h3 { font-size: 19px; margin: 2px 0 8px; }
  .phase-body p { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .01em;
    padding: 4px 10px; border-radius: 20px; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--muted);
  }

  /* ---- iPhone track ---- */
  .track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .stage { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
  .stage .when { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .stage h3 { font-size: 16px; margin: 10px 0 8px; }
  .stage p { font-size: 13.5px; color: var(--muted); margin: 0; }
  .stage .effort { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }

  /* ---- Decision footer ---- */
  .decision { padding: 52px 0 72px; }
  .decision .callout { border-left-color: var(--up); }
  .qopts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .qopt { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; }
  .qopt .q { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .04em; }
  .qopt p { font-size: 14px; color: var(--muted); margin: 6px 0 0; }

  footer { padding: 28px 0 60px; }
  .foot-line { font-family: var(--mono); font-size: 12px; color: var(--faint); letter-spacing: .03em; display: flex; flex-wrap: wrap; gap: 6px 16px; }

  @media (max-width: 720px) {
    .ticker { grid-template-columns: repeat(2, 1fr); }
    .cards, .qopts, .track { grid-template-columns: 1fr; }
    .phase { grid-template-columns: 1fr; gap: 12px; }
    .phase-idx { display: flex; align-items: baseline; gap: 10px; }
    .phase-idx .t { margin-top: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .card, .prio-row, .stage { transition: border-color .2s ease, transform .2s ease; }
    .card:hover, .prio-row:hover, .stage:hover { border-color: var(--border-strong); }
  }
  a { color: var(--accent); text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
&lt;/style&gt;

&lt;div class=&quot;topbar&quot;&gt;

&lt;div class=&quot;wrap&quot;&gt;

  &lt;header class=&quot;hero&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;State of the Terminal&lt;/p&gt;
    &lt;h1&gt;What you&#x27;ve built, what&#x27;s real, &lt;span class=&quot;amp&quot;&gt;&amp;&lt;/span&gt; the path to making it great.&lt;/h1&gt;
    &lt;p class=&quot;lede&quot;&gt;A code-grounded assessment of &lt;strong&gt;dsh-alpha-insight&lt;/strong&gt; — a multi-user AI trading terminal — across security, multi-user reporting, live trading, and backtesting, plus a phased plan to production and onto iPhone.&lt;/p&gt;

    &lt;div class=&quot;ticker&quot;&gt;
      &lt;div class=&quot;cell&quot;&gt;&lt;p class=&quot;k&quot;&gt;Routes&lt;/p&gt;&lt;div class=&quot;v&quot;&gt;35&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;pages built&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;cell&quot;&gt;&lt;p class=&quot;k&quot;&gt;DB migrations&lt;/p&gt;&lt;div class=&quot;v&quot;&gt;24&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;RLS enabled&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;cell&quot;&gt;&lt;p class=&quot;k&quot;&gt;Live execution&lt;/p&gt;&lt;div class=&quot;v crit&quot;&gt;0&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;paper only&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;cell&quot;&gt;&lt;p class=&quot;k&quot;&gt;Data tenancy&lt;/p&gt;&lt;div class=&quot;v crit&quot;&gt;1&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;shared, not per-user&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;cell&quot;&gt;&lt;p class=&quot;k&quot;&gt;Foundation&lt;/p&gt;&lt;div class=&quot;v ok&quot;&gt;Strong&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;real, not mocked&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/header&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;Executive summary&lt;/p&gt;
    &lt;h2&gt;You&#x27;re ~75% of the way to the product you described — but two structural gaps must close first.&lt;/h2&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;p&gt;&lt;strong&gt;The good news:&lt;/strong&gt; this is a real, substantial application, not a demo. Thirty-five routes, a proper Supabase backend with Row-Level Security on every table, live market data (Finnhub + Yahoo), read-only brokerage linking through SnapTrade, AI research and paper-trading &quot;funds,&quot; and a backtesting engine wired to real historical prices. The bones of a serious trading terminal are here.&lt;/p&gt;
      &lt;p style=&quot;margin-top:16px&quot;&gt;&lt;strong&gt;The two gaps that define the work ahead:&lt;/strong&gt; (1) the core screens are &lt;strong&gt;single-tenant&lt;/strong&gt; — everyone shares one portfolio and watchlist — so &quot;multiple people, each with their own reports&quot; isn&#x27;t true yet; and (2) &lt;strong&gt;nothing places a live trade&lt;/strong&gt; — every &quot;trade&quot; is simulated. Neither is a flaw in the vision; both are the natural next build phase, and both are very achievable.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot; style=&quot;margin-top:16px;border-left-color:var(--warn)&quot;&gt;
      &lt;p&gt;&lt;strong&gt;Correction to my first read:&lt;/strong&gt; I initially warned that the committed &lt;code&gt;.env&lt;/code&gt; meant &quot;rotate every key.&quot; After reading it, that was an over-alarm. The committed &lt;code&gt;.env&lt;/code&gt; holds &lt;strong&gt;only public values&lt;/strong&gt; (Supabase URL, project ref, and the publishable/anon key that ships to the browser anyway). &lt;strong&gt;No service-role key and no third-party API keys are committed&lt;/strong&gt; — those stay server-side at runtime. It&#x27;s still worth untracking, but it is not an emergency.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;Assessment · four domains&lt;/p&gt;
    &lt;h2&gt;Graded against what a production version needs.&lt;/h2&gt;
    &lt;div class=&quot;cards&quot;&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-head&quot;&gt;
          &lt;div&gt;&lt;span class=&quot;num&quot;&gt;01&lt;/span&gt;&lt;h3&gt;Multi-user &amp; reports&lt;/h3&gt;&lt;/div&gt;
          &lt;span class=&quot;grade crit&quot;&gt;NEEDS WORK&lt;/span&gt;
        &lt;/div&gt;
        &lt;ul&gt;
          &lt;li class=&quot;minus&quot;&gt;&lt;strong&gt;Single-tenant bug (top priority).&lt;/strong&gt; Dashboard, Portfolio, Watchlist, Settings &amp; AI Reports run on the RLS-bypassing service-role client and read one &lt;em&gt;global&lt;/em&gt; row — every user shares the same data.&lt;/li&gt;
          &lt;li class=&quot;minus&quot;&gt;&lt;strong&gt;No auth gate&lt;/strong&gt; on those endpoints — effectively reachable without a token.&lt;/li&gt;
          &lt;li class=&quot;minus&quot;&gt;&lt;strong&gt;No roles / teams / orgs.&lt;/strong&gt; No structure yet for &quot;multiple people collaborating.&quot;&lt;/li&gt;
          &lt;li class=&quot;plus&quot;&gt;Auth itself is sound: Supabase email/password + Google, tokens verified server-side.&lt;/li&gt;
          &lt;li class=&quot;plus&quot;&gt;Notes, chat, accounts, managed portfolios &lt;em&gt;are&lt;/em&gt; correctly per-user.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-head&quot;&gt;
          &lt;div&gt;&lt;span class=&quot;num&quot;&gt;02&lt;/span&gt;&lt;h3&gt;Live trading&lt;/h3&gt;&lt;/div&gt;
          &lt;span class=&quot;grade warn&quot;&gt;READ-ONLY TODAY&lt;/span&gt;
        &lt;/div&gt;
        &lt;ul&gt;
          &lt;li class=&quot;minus&quot;&gt;&lt;strong&gt;No real order execution anywhere.&lt;/strong&gt; SnapTrade is linked as &lt;code&gt;connectionType: &quot;read&quot;&lt;/code&gt; — positions sync in, nothing goes out.&lt;/li&gt;
          &lt;li class=&quot;minus&quot;&gt;&lt;strong&gt;&quot;Managed,&quot; &quot;AI Funds,&quot; &quot;Day Trader&quot; are paper.&lt;/strong&gt; Fills book against database rows at the last quote — no spread, slippage, or market-hours checks.&lt;/li&gt;
          &lt;li class=&quot;plus&quot;&gt;The safe architecture is already chosen: users link &lt;em&gt;their own&lt;/em&gt; broker; the app never custodies money.&lt;/li&gt;
          &lt;li class=&quot;plus&quot;&gt;Clean, disclosed separation — the honest base to build real execution on, deliberately.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-head&quot;&gt;
          &lt;div&gt;&lt;span class=&quot;num&quot;&gt;03&lt;/span&gt;&lt;h3&gt;Backtesting engine&lt;/h3&gt;&lt;/div&gt;
          &lt;span class=&quot;grade warn&quot;&gt;SOLID CORE&lt;/span&gt;
        &lt;/div&gt;
        &lt;ul&gt;
          &lt;li class=&quot;plus&quot;&gt;&lt;strong&gt;Real data, correct mechanics.&lt;/strong&gt; Runs on real Yahoo daily bars; equity curve, drawdown, Wilder-smoothed RSI and rolling SMA are all correct.&lt;/li&gt;
          &lt;li class=&quot;minus&quot;&gt;&lt;strong&gt;No transaction costs or slippage&lt;/strong&gt; — flatters high-frequency configs.&lt;/li&gt;
          &lt;li class=&quot;minus&quot;&gt;&lt;strong&gt;Stop-losses fill at the close, not intrabar&lt;/strong&gt; — the single biggest result distortion.&lt;/li&gt;
          &lt;li class=&quot;minus&quot;&gt;&lt;strong&gt;No Sharpe, no benchmark.&lt;/strong&gt; &quot;3 strategies&quot; is really one strategy with three presets.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;div class=&quot;card-head&quot;&gt;
          &lt;div&gt;&lt;span class=&quot;num&quot;&gt;04&lt;/span&gt;&lt;h3&gt;Security &amp; secrets&lt;/h3&gt;&lt;/div&gt;
          &lt;span class=&quot;grade good&quot;&gt;MOSTLY SOUND&lt;/span&gt;
        &lt;/div&gt;
        &lt;ul&gt;
          &lt;li class=&quot;plus&quot;&gt;&lt;strong&gt;RLS enabled on every table&lt;/strong&gt;, per-user tables scoped to &lt;code&gt;auth.uid()&lt;/code&gt;.&lt;/li&gt;
          &lt;li class=&quot;plus&quot;&gt;No catastrophic secrets committed; third-party &amp; service-role keys stay server-side.&lt;/li&gt;
          &lt;li class=&quot;minus&quot;&gt;&lt;strong&gt;Public cron hooks gated only by the public anon key&lt;/strong&gt; — anyone could trigger expensive LLM/trading jobs. Top fix.&lt;/li&gt;
          &lt;li class=&quot;minus&quot;&gt;&lt;strong&gt;SnapTrade &lt;code&gt;user_secret&lt;/code&gt; is browser-readable&lt;/strong&gt; — should never leave the server.&lt;/li&gt;
          &lt;li class=&quot;minus&quot;&gt;&lt;code&gt;.env&lt;/code&gt; is tracked in git (public values only) — untrack it.&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;

    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;What I&#x27;d do first&lt;/p&gt;
    &lt;h2&gt;Ordered by leverage, not by area.&lt;/h2&gt;
    &lt;div class=&quot;prio&quot;&gt;
      &lt;div class=&quot;prio-row&quot;&gt;
        &lt;div class=&quot;tier p0&quot;&gt;P0&lt;/div&gt;
        &lt;div&gt;
          &lt;h3&gt;Make the app truly multi-user&lt;/h3&gt;
          &lt;p&gt;Route the core screens through the authenticated, per-user client and stamp &lt;code&gt;user_id&lt;/code&gt; on every read and write. This is what turns &quot;one shared terminal&quot; into &quot;everyone has their own.&quot; Nothing else matters until this is true.&lt;/p&gt;
          &lt;div class=&quot;files&quot;&gt;terminal.functions.ts · terminal.server.ts · +requireSupabaseAuth&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;prio-row&quot;&gt;
        &lt;div class=&quot;tier p0&quot;&gt;P0&lt;/div&gt;
        &lt;div&gt;
          &lt;h3&gt;Lock the public hooks&lt;/h3&gt;
          &lt;p&gt;Swap the anon-key gate for a dedicated server-only secret with a constant-time compare, and rotate it into the cron config. Small change, closes a real cost-abuse hole.&lt;/p&gt;
          &lt;div class=&quot;files&quot;&gt;src/routes/api/public/hooks/*.ts&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;prio-row&quot;&gt;
        &lt;div class=&quot;tier p1&quot;&gt;P1&lt;/div&gt;
        &lt;div&gt;
          &lt;h3&gt;Tenancy hygiene: &lt;code&gt;.env&lt;/code&gt; + SnapTrade secret&lt;/h3&gt;
          &lt;p&gt;Untrack &lt;code&gt;.env&lt;/code&gt; (add &lt;code&gt;.env.example&lt;/code&gt;); revoke browser &lt;code&gt;SELECT&lt;/code&gt; on &lt;code&gt;snaptrade_users.user_secret&lt;/code&gt; so the brokerage credential stays server-only.&lt;/p&gt;
          &lt;div class=&quot;files&quot;&gt;.gitignore · migration (REVOKE SELECT)&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;prio-row&quot;&gt;
        &lt;div class=&quot;tier p1&quot;&gt;P1&lt;/div&gt;
        &lt;div&gt;
          &lt;h3&gt;Backtest credibility pass&lt;/h3&gt;
          &lt;p&gt;Add transaction costs + slippage, adjusted-close prices, and intrabar stop fills; add Sharpe and a buy-&amp;-hold benchmark. Makes reported numbers trustworthy.&lt;/p&gt;
          &lt;div class=&quot;files&quot;&gt;src/lib/trading-algorithms/*&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;prio-row&quot;&gt;
        &lt;div class=&quot;tier p2&quot;&gt;P2&lt;/div&gt;
        &lt;div&gt;
          &lt;h3&gt;Roles, teams &amp; report sharing&lt;/h3&gt;
          &lt;p&gt;Add a &lt;code&gt;user_roles&lt;/code&gt; / teams model and a per-report visibility scope (private / team / public) so collaboration and shareable reports become first-class.&lt;/p&gt;
          &lt;div class=&quot;files&quot;&gt;new migrations · RLS policies&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;prio-row&quot;&gt;
        &lt;div class=&quot;tier p2&quot;&gt;P2&lt;/div&gt;
        &lt;div&gt;
          &lt;h3&gt;Real trade execution (gated, deliberate)&lt;/h3&gt;
          &lt;p&gt;Only after the above: build the SnapTrade execution layer (impact-preview → place → status → cancel), an order-ticket UI, and hard safety gates. This is the regulated frontier — design review before code.&lt;/p&gt;
          &lt;div class=&quot;files&quot;&gt;snaptrade.server.ts · new order UI&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;Roadmap · phased&lt;/p&gt;
    &lt;h2&gt;From shared demo to production platform.&lt;/h2&gt;
    &lt;div class=&quot;phases&quot;&gt;
      &lt;div class=&quot;phase&quot;&gt;
        &lt;div class=&quot;phase-idx&quot;&gt;&lt;span class=&quot;n&quot;&gt;00&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Harden&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;phase-body&quot;&gt;
          &lt;h3&gt;Security &amp; tenancy foundation&lt;/h3&gt;
          &lt;p&gt;Close the two P0s and the P1 hygiene items. After this phase, each person logs in and sees only their own portfolio, watchlist, settings, and reports — and no endpoint runs unauthenticated. This is the gate to everything else.&lt;/p&gt;
          &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;per-user data layer&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;hook auth&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;.env untrack&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;secret revoke&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;phase&quot;&gt;
        &lt;div class=&quot;phase-idx&quot;&gt;&lt;span class=&quot;n&quot;&gt;01&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Reports&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;phase-body&quot;&gt;
          &lt;h3&gt;A real multi-user reporting product&lt;/h3&gt;
          &lt;p&gt;Replace the remaining seeded/&quot;demo&quot; panels with live data, add per-report ownership and visibility, and give the dashboard honest per-user analytics. This is the &quot;multiple people look at it and see reports&quot; milestone.&lt;/p&gt;
          &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;retire DemoTag mocks&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;report visibility&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;real risk analytics&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;notifications&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;phase&quot;&gt;
        &lt;div class=&quot;phase-idx&quot;&gt;&lt;span class=&quot;n&quot;&gt;02&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Collaborate&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;phase-body&quot;&gt;
          &lt;h3&gt;Teams, roles &amp; sharing&lt;/h3&gt;
          &lt;p&gt;Introduce teams/orgs, admin vs member roles, and shareable report links. Turns individual accounts into a group that can work off the same research while keeping personal portfolios private.&lt;/p&gt;
          &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;user_roles&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;teams&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;share links&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;RLS by membership&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;phase&quot;&gt;
        &lt;div class=&quot;phase-idx&quot;&gt;&lt;span class=&quot;n&quot;&gt;03&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Rigor&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;phase-body&quot;&gt;
          &lt;h3&gt;Serious backtesting &amp; signals&lt;/h3&gt;
          &lt;p&gt;Cost/slippage modeling, intrabar stops, risk-adjusted metrics, benchmark comparison, and genuinely distinct strategies with out-of-sample validation. Makes the &quot;alpha&quot; in Alpha Insight defensible.&lt;/p&gt;
          &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;costs + slippage&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Sharpe / Sortino&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;benchmark&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;walk-forward&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;phase&quot;&gt;
        &lt;div class=&quot;phase-idx&quot;&gt;&lt;span class=&quot;n&quot;&gt;04&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;Execute&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;phase-body&quot;&gt;
          &lt;h3&gt;Live trading (regulated frontier)&lt;/h3&gt;
          &lt;p&gt;The SnapTrade execution layer, order-ticket UI, and safety gating — plus the compliance conversation that comes with routing real orders and AI-driven allocation. Deliberately last, and gated behind a design review.&lt;/p&gt;
          &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;order impact + place&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;order UI&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;safety gates&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;compliance review&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;iPhone · phased track&lt;/p&gt;
    &lt;h2&gt;Onto your phone — reusing what&#x27;s already built.&lt;/h2&gt;
    &lt;p style=&quot;color:var(--muted);max-width:64ch;margin-bottom:24px&quot;&gt;Because the app is React with a clean Supabase backend, the phone path is progressive: each stage reuses the last, and the architecture from Phase 00 (shared logic + a clean API) is what makes it painless later.&lt;/p&gt;
    &lt;div class=&quot;track&quot;&gt;
      &lt;div class=&quot;stage&quot;&gt;
        &lt;div class=&quot;when&quot;&gt;Now&lt;/div&gt;
        &lt;h3&gt;Installable PWA&lt;/h3&gt;
        &lt;p&gt;Add a manifest + service worker so the existing site installs to the iPhone home screen with an app icon, splash, and offline shell. Zero App Store friction.&lt;/p&gt;
        &lt;div class=&quot;effort&quot;&gt;Effort: low · Reuses: everything&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage&quot;&gt;
        &lt;div class=&quot;when&quot;&gt;Next&lt;/div&gt;
        &lt;h3&gt;Capacitor wrapper&lt;/h3&gt;
        &lt;p&gt;Wrap the same web app in a native shell for a real App Store listing plus Face ID login and native push notifications. Minimal new code.&lt;/p&gt;
        &lt;div class=&quot;effort&quot;&gt;Effort: medium · Reuses: full web app&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;stage&quot;&gt;
        &lt;div class=&quot;when&quot;&gt;Later&lt;/div&gt;
        &lt;h3&gt;React Native / Expo&lt;/h3&gt;
        &lt;p&gt;A fully native client that reuses your Supabase backend and shared &lt;code&gt;trading-algorithms&lt;/code&gt; logic. Best UX — worth it only once the product is proven.&lt;/p&gt;
        &lt;div class=&quot;effort&quot;&gt;Effort: high · Reuses: backend + core logic&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;decision&quot;&gt;
    &lt;p class=&quot;sec-label&quot;&gt;Your call&lt;/p&gt;
    &lt;h2&gt;Where should I point first?&lt;/h2&gt;
    &lt;div class=&quot;callout&quot;&gt;
      &lt;p&gt;My recommendation: &lt;strong&gt;start with Phase 00&lt;/strong&gt; — specifically the per-user data layer. It&#x27;s the highest-leverage change, it&#x27;s what makes the app genuinely multi-user, and it unblocks everything else on the roadmap. It&#x27;s also a contained, well-scoped piece of work.&lt;/p&gt;
      &lt;p style=&quot;margin-top:14px&quot;&gt;One logistics note before I write code: I currently have &lt;strong&gt;read-only&lt;/strong&gt; access to &lt;code&gt;dsh-alpha-insight&lt;/code&gt;, and it&#x27;s a &lt;strong&gt;Lovable-connected&lt;/strong&gt; repo (pushes sync into your Lovable editor and its history shouldn&#x27;t be rewritten). To commit fixes there I&#x27;ll need push access — or we decide together how you want changes delivered.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;qopts&quot;&gt;
      &lt;div class=&quot;qopt&quot;&gt;&lt;div class=&quot;q&quot;&gt;OPTION A&lt;/div&gt;&lt;p&gt;Start Phase 00 — make it truly multi-user + lock the hooks. (Recommended)&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;qopt&quot;&gt;&lt;div class=&quot;q&quot;&gt;OPTION B&lt;/div&gt;&lt;p&gt;Start with the backtesting credibility pass — it&#x27;s self-contained and visible.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;qopt&quot;&gt;&lt;div class=&quot;q&quot;&gt;OPTION C&lt;/div&gt;&lt;p&gt;Ship the PWA first, so you can put it on your phone this week.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;qopt&quot;&gt;&lt;div class=&quot;q&quot;&gt;OPTION D&lt;/div&gt;&lt;p&gt;Go deeper on any one domain before we touch code.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;footer&gt;
    &lt;div class=&quot;foot-line&quot;&gt;
      &lt;span&gt;DSH ALPHA INSIGHT&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;CODE AUDIT + ROADMAP&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;4 DOMAINS REVIEWED&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;GENERATED FROM SOURCE, NOT ASSUMPTIONS&lt;/span&gt;

&lt;div class=&quot;wrap&quot;&gt;
  &lt;header class=&quot;hero&quot;&gt;
    &lt;p class=&quot;eyebrow&quot;&gt;The Regulated Frontier&lt;/p&gt;
    &lt;h1&gt;Turning DSH from read-only into a place people actually trade.&lt;/h1&gt;
    &lt;p class=&quot;lede&quot;&gt;Everything today is read-only or paper. Real execution is a deliberate, gated build — not a flag flip. This lays out the flow, the safety stack, what has to be built, the compliance questions, and the decisions only you can make.&lt;/p&gt;
  &lt;/header&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;Where you are today&lt;/p&gt;
    &lt;h2&gt;One string is all that separates the app from live orders — and that&#x27;s the problem.&lt;/h2&gt;
    &lt;div class=&quot;callout crit&quot;&gt;
      &lt;p&gt;SnapTrade is linked as &lt;code&gt;connectionType: &quot;read&quot;&lt;/code&gt; (&lt;code&gt;snaptrade.server.ts:127&lt;/code&gt;). Positions and balances flow &lt;em&gt;in&lt;/em&gt;; nothing goes &lt;em&gt;out&lt;/em&gt;. The &quot;Managed,&quot; &quot;AI Funds,&quot; and &quot;Day Trader&quot; engines execute against database rows at the last quote — &lt;strong&gt;no broker, no real capital&lt;/strong&gt;. That&#x27;s a safe, honest starting point. But it means &quot;go live&quot; is often imagined as flipping &lt;code&gt;read&lt;/code&gt; → &lt;code&gt;trade&lt;/code&gt;, and it is emphatically not: that flag with no gates around it is how people lose money and you inherit liability. The rest of this document is the scaffolding that has to exist &lt;em&gt;before&lt;/em&gt; that flag ever changes.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;The execution flow&lt;/p&gt;
    &lt;h2&gt;What a single live order actually has to do.&lt;/h2&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;idx&quot;&gt;1&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Order ticket&lt;/h3&gt;&lt;p&gt;User specifies symbol, side, quantity (or notional), order type (market / limit), and time-in-force. Client-side validation only — nothing is trusted yet.&lt;/p&gt;&lt;div class=&quot;tag&quot;&gt;new UI · none exists today&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;idx&quot;&gt;2&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Pre-trade checks (server)&lt;/h3&gt;&lt;p&gt;Re-validate everything server-side: market hours, buying power vs. the synced balance, position limits, symbol tradability, PDT/day-trade count, and per-user risk caps. Reject before touching the broker.&lt;/p&gt;&lt;div class=&quot;tag&quot;&gt;new server layer&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;idx&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Impact preview&lt;/h3&gt;&lt;p&gt;Call SnapTrade &lt;code&gt;POST /trade/impact&lt;/code&gt; to get estimated price, fees, and buying-power effect. Show the user a review screen with the real numbers. Nothing is placed yet.&lt;/p&gt;&lt;div class=&quot;tag&quot;&gt;SnapTrade trade API&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;idx&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Explicit confirm → place&lt;/h3&gt;&lt;p&gt;User confirms the previewed order. Server places it (&lt;code&gt;POST /trade/{tradeId}&lt;/code&gt;) with an idempotency key so a double-tap or retry can&#x27;t duplicate the order.&lt;/p&gt;&lt;div class=&quot;tag&quot;&gt;idempotent · audited&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;idx&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Status &amp;amp; fills&lt;/h3&gt;&lt;p&gt;Poll or webhook order status until filled / partially filled / rejected / cancelled. Persist every state transition. Surface it live in the UI; allow cancel of working orders.&lt;/p&gt;&lt;div class=&quot;tag&quot;&gt;reconciliation&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;idx&quot;&gt;6&lt;/div&gt;&lt;div&gt;&lt;h3&gt;Reconcile&lt;/h3&gt;&lt;p&gt;Replace the current &quot;fill at last quote&quot; assumption with the broker&#x27;s &lt;em&gt;actual&lt;/em&gt; fill price and fees. Update positions, cash, and the audit log from truth, not estimate.&lt;/p&gt;&lt;div class=&quot;tag&quot;&gt;truth over estimate&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;The safety stack&lt;/p&gt;
    &lt;h2&gt;Layers between &quot;tap&quot; and &quot;real money leaves.&quot;&lt;/h2&gt;
    &lt;div class=&quot;gates&quot;&gt;
      &lt;div class=&quot;gate&quot;&gt;&lt;span class=&quot;lock&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Feature flag + per-user opt-in&lt;/h3&gt;&lt;p&gt;Live trading off by default, globally and per user. A user must explicitly enable it and re-consent SnapTrade with trade scope — separate from the read-only link they have now.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;gate&quot;&gt;&lt;span class=&quot;lock&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Server-side authority&lt;/h3&gt;&lt;p&gt;Every order validated and placed server-side under the user&#x27;s own auth. The client never talks to the broker directly and can never be the source of truth for buying power or limits.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;gate&quot;&gt;&lt;span class=&quot;lock&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Explicit review + confirm&lt;/h3&gt;&lt;p&gt;No order places without the user seeing the impact preview and confirming. No &quot;one-tap trade&quot; at launch.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;gate&quot;&gt;&lt;span class=&quot;lock&quot;&gt;04&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Risk limits &amp;amp; kill switch&lt;/h3&gt;&lt;p&gt;Per-order and per-day notional caps, max position size, and a global kill switch that halts all order routing instantly if something looks wrong.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;gate&quot;&gt;&lt;span class=&quot;lock&quot;&gt;05&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Idempotency &amp;amp; audit trail&lt;/h3&gt;&lt;p&gt;Every order carries an idempotency key; every state change is logged immutably (who, what, when, which key). This is both a safety and a compliance requirement.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;gate&quot;&gt;&lt;span class=&quot;lock&quot;&gt;06&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Hard separation of paper vs live&lt;/h3&gt;&lt;p&gt;Paper and live accounts never share a code path that could cross wires. A live order is visually and structurally unmistakable from a simulated one.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;Compliance landscape&lt;/p&gt;
    &lt;h2&gt;The honest flags — read before writing any execution code.&lt;/h2&gt;
    &lt;div class=&quot;callout warn&quot; style=&quot;margin-bottom:18px&quot;&gt;
      &lt;p&gt;I&#x27;m not a lawyer and this isn&#x27;t legal advice. But the shape of the regulatory questions is predictable, and &lt;strong&gt;which ones apply depends almost entirely on the first decision below&lt;/strong&gt; — whether users place their own orders, or the app/AI places orders for them.&lt;/p&gt;
    &lt;/div&gt;
    &lt;ul class=&quot;clean&quot;&gt;
      &lt;li&gt;&lt;strong&gt;Self-directed vs. discretionary.&lt;/strong&gt; If each user places their own orders through their own linked broker, you&#x27;re a software front-end over a regulated broker (SnapTrade + the executing broker carry most of the burden). If the &lt;em&gt;app or an AI&lt;/em&gt; decides and places trades on someone&#x27;s behalf, that&#x27;s discretionary asset management — likely &lt;strong&gt;RIA&lt;/strong&gt; and/or &lt;strong&gt;broker-dealer&lt;/strong&gt; territory, with registration, suitability, and fiduciary duties.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;AI-driven allocation raises the bar.&lt;/strong&gt; The &quot;Managed&quot; and &quot;AI Funds&quot; engines currently pick trades with an LLM. Pointing those at real money is the single biggest compliance escalation in the whole project — suitability, best-execution, and advice-giving all attach.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Disclosures &amp;amp; agreements.&lt;/strong&gt; Risk disclosures, terms of service, and clear &quot;this is not investment advice&quot; labeling — especially anywhere AI output sits next to a trade button.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Pattern Day Trader &amp;amp; margin rules.&lt;/strong&gt; If day-trading features touch real accounts, PDT ($25k equity) and margin rules must be enforced or surfaced.&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Data &amp;amp; credential handling.&lt;/strong&gt; Trade-scoped broker credentials are far more sensitive than read tokens. (Already flagged: the SnapTrade &lt;code&gt;user_secret&lt;/code&gt; should be server-only — fixed in the multi-user PR.)&lt;/li&gt;
      &lt;li&gt;&lt;strong&gt;Record-keeping.&lt;/strong&gt; Order audit trails and communications may need retention regardless of registration status.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;Decisions only you can make&lt;/p&gt;
    &lt;h2&gt;Four forks that determine everything downstream.&lt;/h2&gt;
    &lt;div class=&quot;decisions&quot;&gt;

      &lt;div class=&quot;decision&quot;&gt;
        &lt;p class=&quot;q&quot;&gt;Decision 1 — the big one&lt;/p&gt;
        &lt;h3&gt;Who places the order?&lt;/h3&gt;
        &lt;div class=&quot;opts&quot;&gt;
          &lt;div class=&quot;opt rec&quot;&gt;
            &lt;div class=&quot;name&quot;&gt;User places their own&lt;/div&gt;
            &lt;div class=&quot;note&quot;&gt;Self-directed. App shows research + a ticket; the human decides and confirms every trade through their own broker link.&lt;/div&gt;
            &lt;span class=&quot;flag&quot;&gt;Lower regulatory burden&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;opt risk&quot;&gt;
            &lt;div class=&quot;name&quot;&gt;App / AI places for them&lt;/div&gt;
            &lt;div class=&quot;note&quot;&gt;Discretionary / automated. The managed &amp;amp; AI-fund engines route real orders. Powerful, but this is RIA/BD territory.&lt;/div&gt;
            &lt;span class=&quot;flag&quot;&gt;Registration likely required&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;decision&quot;&gt;
        &lt;p class=&quot;q&quot;&gt;Decision 2 — rollout&lt;/p&gt;
        &lt;h3&gt;How cautiously do we go live?&lt;/h3&gt;
        &lt;div class=&quot;opts&quot;&gt;
          &lt;div class=&quot;opt rec&quot;&gt;
            &lt;div class=&quot;name&quot;&gt;Paper-parity first&lt;/div&gt;
            &lt;div class=&quot;note&quot;&gt;Build the full ticket → preview → confirm → status flow against the &lt;em&gt;paper&lt;/em&gt; engine, prove it end to end, then swap the execution adapter to SnapTrade for a small pilot.&lt;/div&gt;
            &lt;span class=&quot;flag&quot;&gt;Recommended&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;opt risk&quot;&gt;
            &lt;div class=&quot;name&quot;&gt;Straight to live&lt;/div&gt;
            &lt;div class=&quot;note&quot;&gt;Wire SnapTrade execution directly. Faster, but every bug is a real-money bug on day one.&lt;/div&gt;
            &lt;span class=&quot;flag&quot;&gt;High blast radius&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;decision&quot;&gt;
        &lt;p class=&quot;q&quot;&gt;Decision 3 — scope at launch&lt;/p&gt;
        &lt;h3&gt;What can users actually do v1?&lt;/h3&gt;
        &lt;div class=&quot;opts&quot;&gt;
          &lt;div class=&quot;opt rec&quot;&gt;
            &lt;div class=&quot;name&quot;&gt;Equities, market + limit&lt;/div&gt;
            &lt;div class=&quot;note&quot;&gt;Whole-share equity orders, market and limit, day / GTC. Covers most use, smallest surface.&lt;/div&gt;
            &lt;span class=&quot;flag&quot;&gt;Smallest safe surface&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;opt&quot;&gt;
            &lt;div class=&quot;name&quot;&gt;+ Options / fractional / more&lt;/div&gt;
            &lt;div class=&quot;note&quot;&gt;Options, fractional shares, advanced order types. Each adds real complexity and rules — defer past v1.&lt;/div&gt;
            &lt;span class=&quot;flag&quot;&gt;Later phase&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;decision&quot;&gt;
        &lt;p class=&quot;q&quot;&gt;Decision 4 — the AI engines&lt;/p&gt;
        &lt;h3&gt;Do &quot;Managed&quot; &amp;amp; &quot;AI Funds&quot; ever trade real money?&lt;/h3&gt;
        &lt;div class=&quot;opts&quot;&gt;
          &lt;div class=&quot;opt rec&quot;&gt;
            &lt;div class=&quot;name&quot;&gt;Stay paper / advisory&lt;/div&gt;
            &lt;div class=&quot;note&quot;&gt;Keep them as simulation and idea-generation; a human still places any real trade. Sidesteps the heaviest regulation.&lt;/div&gt;
            &lt;span class=&quot;flag&quot;&gt;Simplest&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;opt risk&quot;&gt;
            &lt;div class=&quot;name&quot;&gt;Real discretionary&lt;/div&gt;
            &lt;div class=&quot;note&quot;&gt;Let them execute. Requires the Decision-1 &quot;app places&quot; path and everything that comes with it.&lt;/div&gt;
            &lt;span class=&quot;flag&quot;&gt;Heaviest compliance&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;What gets built&lt;/p&gt;
    &lt;h2&gt;Components, mapped to the codebase.&lt;/h2&gt;
    &lt;div class=&quot;comp&quot;&gt;
      &lt;div class=&quot;citem&quot;&gt;&lt;h3&gt;Execution adapter&lt;/h3&gt;&lt;p&gt;Impact-preview, place, status, and cancel against SnapTrade&#x27;s trade API, behind an interface so paper and live share one shape.&lt;/p&gt;&lt;div class=&quot;files&quot;&gt;snaptrade.server.ts (extend)&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;citem&quot;&gt;&lt;h3&gt;Order server functions&lt;/h3&gt;&lt;p&gt;Authenticated preview / place / cancel with server-side validation + idempotency keys.&lt;/p&gt;&lt;div class=&quot;files&quot;&gt;new: orders.functions.ts / .server.ts&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;citem&quot;&gt;&lt;h3&gt;Order ticket UI&lt;/h3&gt;&lt;p&gt;Ticket, impact-review screen, working-orders list, cancel, live status.&lt;/p&gt;&lt;div class=&quot;files&quot;&gt;new terminal components&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;citem&quot;&gt;&lt;h3&gt;Risk &amp;amp; limits engine&lt;/h3&gt;&lt;p&gt;Per-order/day caps, position limits, PDT check, global kill switch.&lt;/p&gt;&lt;div class=&quot;files&quot;&gt;new: risk.server.ts&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;citem&quot;&gt;&lt;h3&gt;Reconciliation&lt;/h3&gt;&lt;p&gt;Replace last-quote fills with real broker fills across positions, cash, and trades.&lt;/p&gt;&lt;div class=&quot;files&quot;&gt;managed.server.ts · ai-fund.server.ts&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;citem&quot;&gt;&lt;h3&gt;Audit &amp;amp; consent&lt;/h3&gt;&lt;p&gt;Immutable order log, trade-scope opt-in, disclosures at the point of action.&lt;/p&gt;&lt;div class=&quot;files&quot;&gt;new migrations + UI&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;p class=&quot;sec-label&quot;&gt;Recommended path&lt;/p&gt;
    &lt;h2&gt;If it were mine, this is the sequence.&lt;/h2&gt;
    &lt;div class=&quot;phase-track&quot;&gt;
      &lt;div class=&quot;ptile&quot;&gt;&lt;div class=&quot;n&quot;&gt;A&lt;/div&gt;&lt;h3&gt;Full flow on paper&lt;/h3&gt;&lt;p&gt;Ticket → preview → confirm → status → reconcile, wired to the existing paper engine. All the safety gates, zero real-money risk.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;ptile&quot;&gt;&lt;div class=&quot;n&quot;&gt;B&lt;/div&gt;&lt;h3&gt;Self-directed pilot&lt;/h3&gt;&lt;p&gt;Swap the adapter to SnapTrade trade scope for a tiny allowlist of users, equities + market/limit only, hard caps + kill switch.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;ptile&quot;&gt;&lt;div class=&quot;n&quot;&gt;C&lt;/div&gt;&lt;h3&gt;Broaden carefully&lt;/h3&gt;&lt;p&gt;Widen access, add order types, tighten reconciliation and monitoring. Still self-directed.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;ptile&quot;&gt;&lt;div class=&quot;n&quot;&gt;D&lt;/div&gt;&lt;h3&gt;(Only if you choose) automation&lt;/h3&gt;&lt;p&gt;Real discretionary AI trading — gated behind the registration/compliance work Decision 1 implies. A separate, deliberate program.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot; style=&quot;margin-top:22px&quot;&gt;
      &lt;p&gt;&lt;strong&gt;My recommendation:&lt;/strong&gt; commit to &lt;strong&gt;self-directed&lt;/strong&gt; (Decision 1) and &lt;strong&gt;paper-parity first&lt;/strong&gt; (Decision 2). It gets people real trading through their own brokers with the smallest legal surface, reuses the entire flow you&#x27;d need anyway, and keeps the AI as an advisor rather than a discretionary manager — which is where the heavy regulation lives. You can always escalate later; you can&#x27;t easily un-route a bad automated order.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;footer&gt;
    &lt;div class=&quot;foot-line&quot;&gt;&lt;span&gt;DSH · LIVE TRADING BLUEPRINT&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;DESIGN &amp;amp; DECISIONS&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;NOT LEGAL ADVICE — CONFIRM WITH COUNSEL BEFORE GOING LIVE&lt;/span&gt;&lt;/div&gt;
  &lt;/footer&gt;
&lt;/div&gt;
