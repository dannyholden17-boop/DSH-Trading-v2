# Netlify deploy config for Flux.
# No build step — the site is static HTML/CSS/JS in `site/`.
# Connect this repo in Netlify and it deploys on every push to main.

[build]
  publish = "site"
  command = ""

# Assets are NOT fingerprinted (stable filenames like flux.css), and pages
# cache-bust them with a ?v= query string. So the browser may cache, but it
# must revalidate every time — that way a redeploy (or a bumped ?v=) is visible
# immediately instead of being stuck behind a long max-age.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Serve the branded 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# deploy trigger: post-upgrade republish (Kronos panel, onboarding, account, stripe)
