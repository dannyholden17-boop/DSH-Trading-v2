<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the tape; Flux</title>
<meta name="theme-color" content="#0d1220">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cg stroke-width='2.6' stroke-linecap='round'%3E%3Cline x1='11' y1='13' x2='11' y2='19' stroke='%23f5b93c'/%3E%3Cline x1='16' y1='9' x2='16' y2='23' stroke='%23f2eee4'/%3E%3Cline x1='21' y1='13' x2='21' y2='19' stroke='%233ddc97'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/fonts.css?v=36">
<style>
  /* this page stands alone without flux.css, so it carries the room's
     backdrop and the hero's glass tokens itself */
  :root{color-scheme:dark;
    --glass:rgba(14,19,32,.58);
    --glass-line:rgba(226,234,248,.14);
    --glass-blur:blur(18px) saturate(1.2);
    --glass-shadow:0 2px 8px rgba(0,0,0,.35), 0 40px 80px -36px rgba(0,0,0,.9)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    position:relative;
    display:grid;place-items:center;text-align:center;padding:24px;
    color:#f2f5fb;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#070a12;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-color:#070a12;
    background-image:
      radial-gradient(1250px 640px at 50% -14%, rgba(245,185,60,.16), transparent 62%),
      radial-gradient(900px 520px at 88% 4%,  rgba(255,212,121,.10), transparent 58%),
      linear-gradient(180deg, rgba(7,10,18,.42) 0%, rgba(7,10,18,.66) 60%, rgba(7,10,18,.84) 100%),
      url("./assets/img/backdrop.jpg");
    background-image:
      radial-gradient(1250px 640px at 50% -14%, rgba(245,185,60,.16), transparent 62%),
      radial-gradient(900px 520px at 88% 4%,  rgba(255,212,121,.10), transparent 58%),
      linear-gradient(180deg, rgba(7,10,18,.42) 0%, rgba(7,10,18,.66) 60%, rgba(7,10,18,.84) 100%),
      image-set(url("./assets/img/backdrop.webp") type("image/webp"), url("./assets/img/backdrop.jpg") type("image/jpeg"));
    background-size:auto,auto,auto,cover;background-position:center,center,center,64% 40%;
    background-repeat:no-repeat;
  }
  .card{
    position:relative;z-index:1;
    max-width:520px;padding:clamp(36px,6vw,56px);border-radius:6px;
    background:var(--glass);
    -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-line);
    box-shadow:var(--glass-shadow);
  }
  .code{
    font-family:"Azeret Mono",ui-monospace,monospace;font-size:clamp(2.5rem,1.6rem + 3.6vw,4.2rem);font-weight:700;letter-spacing:-.04em;line-height:1;
    color:#f5b93c;
  }
  h1{font-size:clamp(1.85rem,1.3rem + 2.1vw,2.8rem);margin:14px 0 12px;letter-spacing:-.01em}
  p{color:#a8b4cd;margin:0 0 28px;line-height:1.6;font-size:1rem}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;
    padding:14px 26px;border-radius:2px;border:1px solid transparent;cursor:pointer;text-decoration:none;color:#120d05;transition:transform .12s}
  .btn:active{transform:scale(.975)}
  .btn-primary{background:#f0b93f;box-shadow:0 1px 0 rgba(0,0,0,.5), 0 2px 6px -2px rgba(0,0,0,.7)}
  .btn-primary:hover{background:#ffc95a}
  .btn-ghost{background:transparent;border-color:var(--glass-line);color:#f2f5fb}
  .btn-ghost:hover{border-color:#f5b93c;color:#f5b93c;background:rgba(245,185,60,.06)}
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>This ticker isn't on the tape.</h1>
    <p>The page you're after doesn't exist, but the desk is still scanning
      6,412 others. Head back and let Flux do the watching.</p>
    <div class="btns">
      <a class="btn btn-primary" href="./index.html">Back to home</a>
      <a class="btn btn-ghost" href="./terminal.html">Open the desk</a>
    </div>
  </main>
</body>
</html>
