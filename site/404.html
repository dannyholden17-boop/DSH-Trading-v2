<head>

<link rel="stylesheet" href="./assets/dsh.css">
<style>
  .lost{min-height:100vh;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}
  .lost .inner{position:relative;z-index:1;padding:var(--gutter);max-width:52ch}
  .code{font-family:var(--f-display);font-size:clamp(4rem,10vw,8rem);font-weight:750;letter-spacing:-.04em;
    background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .lost h1{font-size:var(--step-2);margin:10px 0 14px}
  .lost p{color:var(--text-dim);margin-bottom:28px}
  .lost .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
  <main class="lost">
    <div class="aurora"></div>
    <div class="grid-lines"></div>
    <div class="inner">
      <div class="code">404</div>
      <h1>This ticker isn't on the tape.</h1>
      <p>The page you're after doesn't exist — but the desk is still scanning
        6,412 others. Head back and let Sentinel do the watching.</p>
      <div class="btns">
        <a class="btn btn-primary btn-lg" href="./index.html">Back to home</a>
        <a class="btn btn-ghost btn-lg" href="./app.html">Open the desk</a>
      </div>
    </div>
  </main>
  <script src="./assets/dsh.js" defer></script>
</body>
</html>
