<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the tape — Flux</title>
<meta name="theme-color" content="#0d1220">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23020617'/%3E%3Cg stroke-width='2.6' stroke-linecap='round'%3E%3Cline x1='11' y1='13' x2='11' y2='19' stroke='%2300f2ff'/%3E%3Cline x1='16' y1='9' x2='16' y2='23' stroke='%236ab8ff'/%3E%3Cline x1='21' y1='13' x2='21' y2='19' stroke='%238b5cf6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="./assets/fonts.css?v=24">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:grid;place-items:center;text-align:center;padding:24px;
    color:#f2f5fb;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(700px 460px at 12% -6%, rgba(245,185,60,.10), transparent 60%),
      radial-gradient(720px 480px at 105% 8%, rgba(122,167,255,.12), transparent 60%),
      #0d1220;
  }
  .card{
    max-width:520px;padding:clamp(36px,6vw,56px);border-radius:4px;
    background:rgba(34,32,29,.6);
    border:1px solid rgba(160,180,220,.16);
    box-shadow:inset 0 1px 0 rgba(160,180,220,.07), 0 4px 0 rgba(0,0,0,.5), 0 20px 38px -22px rgba(0,0,0,1);
  }
  .code{
    font-family:"Azeret Mono",ui-monospace,monospace;font-size:clamp(4rem,12vw,6.5rem);font-weight:700;letter-spacing:-.04em;line-height:1;
    color:#f5b93c;
  }
  h1{font-size:clamp(1.2rem,3.5vw,1.6rem);margin:14px 0 12px;letter-spacing:-.01em}
  p{color:#a8b4cd;margin:0 0 28px;line-height:1.6;font-size:1rem}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;
    padding:14px 26px;border-radius:2px;border:1px solid transparent;cursor:pointer;text-decoration:none;color:#120d05;transition:transform .12s}
  .btn:active{transform:scale(.975)}
  .btn-primary{background:#f0b93f;box-shadow:0 1px 0 rgba(0,0,0,.5), 0 2px 6px -2px rgba(0,0,0,.7)}
  .btn-primary:hover{background:#ffc95a}
  .btn-ghost{background:rgba(245,185,60,.06);border-color:rgba(245,185,60,.35);color:#f5b93c}
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>This ticker isn't on the tape.</h1>
    <p>The page you're after doesn't exist — but the desk is still scanning
      6,412 others. Head back and let Flux do the watching.</p>
    <div class="btns">
      <a class="btn btn-primary" href="./index.html">Back to home</a>
      <a class="btn btn-ghost" href="./terminal.html">Open the desk</a>
    </div>
  </main>
</body>
</html>
