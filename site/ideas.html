<style>
  /* single-screen, no page scroll */
  html,body{height:100%}
  body{overflow:hidden;display:flex;flex-direction:column}
  .id-shell{flex:1;min-height:0;display:flex;flex-direction:column;
    max-width:1080px;width:100%;margin-inline:auto;padding:14px var(--gutter) 10px}
  .id-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .id-live{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--emerald);border:1px solid rgba(61,220,151,.4);background:rgba(61,220,151,.08);
    padding:4px 11px;border-radius:2px;font-weight:700}
  .id-live .dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);animation:idp 1.6s infinite}
  @keyframes idp{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
  .id-head h1{font-size:clamp(1.85rem,1.3rem + 2.1vw,2.8rem);letter-spacing:-.02em;line-height:1;margin:0}
  .id-cap{font-family:var(--f-mono);font-size:12px;color:var(--text-faint);margin-left:auto}

  /* fit area — content scales to fit, never scrolls */
  .id-fit{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:10px}
  .id-stack{width:100%;display:flex;flex-direction:column;gap:9px;transform-origin:top center}

  /* compact stacked idea row */
  .irow{display:grid;grid-template-columns:170px 1fr auto;gap:16px;align-items:center;padding:12px 16px;cursor:pointer;
    transition:border-color .15s,transform .15s}
  .irow:hover{border-color:rgba(245,185,60,.4);transform:translateY(-1px)}
  .ir-lead{display:flex;align-items:center;gap:11px;min-width:0}
  .ir-av{width:38px;height:38px;border-radius:4px;flex:none;display:grid;place-items:center;font-family:var(--f-mono);
    font-weight:700;font-size:12px;border:1px solid var(--line);background:radial-gradient(circle at 30% 30%,rgba(245,185,60,.18),rgba(122,167,255,.12))}
  .ir-tk{font-family:var(--f-mono);font-weight:700;font-size:1rem;letter-spacing:-.01em;display:flex;align-items:baseline;gap:7px}
  .ir-tk .mv{font-size:12.5px;font-weight:600}
  .ir-kind{font-size:12px;color:var(--text-faint);margin-top:2px;text-transform:capitalize}
  .ir-mid{min-width:0}
  .ir-head{font-size:.9rem;font-weight:600;color:var(--text);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ir-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:5px;font-family:var(--f-mono);font-size:12px;color:var(--text-dim)}
  .ir-meta b{color:var(--emerald)}
  .ir-conf{display:inline-flex;align-items:center;gap:6px;color:var(--text-faint)}
  .ir-conf .bar{width:46px;height:5px;border-radius:2px;background:rgba(160,180,220,.10);overflow:hidden}
  .ir-conf .bar i{display:block;height:100%;border-radius:2px}
  .ir-act{display:flex;align-items:center;gap:7px;flex:none}
  .ir-act .btn{padding:6px 11px;font-size:12.5px}
  .ir-brief{font-family:var(--f-mono);font-size:12px;color:var(--cyan);font-weight:700;white-space:nowrap}
  @media(max-width:720px){
    .irow{grid-template-columns:1fr auto;gap:10px}
    .ir-mid{grid-column:1 / -1;order:3}
    .ir-lead{order:1}.ir-act{order:2}
  }
  .irow.locked{cursor:default;border-style:dashed;justify-content:center;grid-template-columns:1fr}
  .irow.locked .lk{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
  .irow.locked .lk .em{font-size:1.5rem}
  .irow.locked .lk b{font-size:1rem}
  .irow.locked .lk span{color:var(--text-faint);font-size:13px}

  .id-foot{font-size:12px;color:var(--text-faint);text-align:center;padding:6px 0 2px;line-height:1.4}
  .id-foot a{color:var(--text-dim)}

  /* brief modal */
  .brief-modal{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(27,25,23,.72);}
  .brief-modal.show{display:flex}
  .brief-sheet{width:min(600px,100%);max-height:86vh;overflow:auto;padding:0;border-radius:4px}
  .bm-head{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line-2);
    position:sticky;top:0;background:var(--glass);z-index:1}
  .bm-x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--text-dim);border-radius:4px;width:32px;height:32px;cursor:pointer;font-size:.9rem}
  .bm-x:hover{color:var(--text);border-color:var(--cyan)}
  .bm-body{padding:18px}
  .bm-headline{font-size:1rem;font-weight:700;line-height:1.4;color:var(--text);margin-bottom:14px}
  .bm-row{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:10px 0;border-bottom:1px solid var(--line-2)}
  @media(max-width:520px){.bm-row{grid-template-columns:1fr;gap:3px}}
  .bm-k{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);padding-top:2px}
  .bm-v{font-size:.9rem;line-height:1.55;color:var(--text-dim)}
  .bm-disc{margin-top:14px;font-size:12px;color:var(--text-faint);line-height:1.5}
  .bm-foot{display:flex;gap:10px;flex-wrap:wrap;padding:13px 18px;border-top:1px solid var(--line-2);position:sticky;bottom:0;background:var(--glass);}
</style>

<body>

<!-- brief modal -->
<div class="brief-modal" id="briefModal" role="dialog" aria-modal="true" aria-labelledby="briefTitle">
  <div class="brief-sheet glass">
    <div class="bm-head">
      <span class="pill live">Fluxi brief</span>
      <h2 id="briefTitle" style="margin:0;font-size:1rem"></h3>
      <button type="button" class="bm-x" data-close aria-label="Close"><i class="ic-i i-close" aria-hidden="true"></i></button>
    </div>

      <button type="button" class="btn btn-primary btn-sm" id="briefDl"><i class="ic-i i-down" aria-hidden="true"></i> Download brief (.txt)</button>
      <button type="button" class="btn btn-ghost btn-sm" id="briefPaper">Paper trade</button>

    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  "use strict";
  var F = window.FLUX || {};
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var EM = F.EM || "#3ddc97", CY = F.CY || "#f5b93c";
  function fmt(n){ return "$" + (+n).toLocaleString(undefined,{maximumFractionDigits:(+n<10?2:0)}); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function liveMv(t){ var p=F.priceOf&&F.priceOf(t), pr=F.prevClose&&F.prevClose(t); if(!p||!pr) return ""; var x=(p-pr)/pr; return (x>=0?"+":"")+(x*100).toFixed(1)+"%"; }

  var list = $("#ideaList"), IDEAS = {};

  var KIND_LBL = {momentum:"Momentum",breakout:"Breakout",undervalued:"Undervalued",rebound:"Rebound",overvalued:"Overvalued · caution"};
  function row(s){
    IDEAS[s.ticker] = s;
    var kind = (s.kind||"momentum");
    var bear = kind==="overvalued" || s.direction==="avoid";
    var col = bear ? (F.CR||"#ff6f52") : ((kind==="momentum"||kind==="breakout") ? EM : CY);
    var mv = liveMv(s.ticker), up = mv!=="" && mv.indexOf("-")<0;
    var el = document.createElement("div");
    el.className = "glass irow reveal"; el.setAttribute("data-brief", s.ticker);
    el.innerHTML =
      '<div class="ir-lead"><div class="ir-av" style="border-color:'+col+'55">'+esc(s.ticker.slice(0,3))+'</div>'+
        '<div><div class="ir-tk">'+esc(s.ticker)+(mv?' <span class="mv '+(up?"up":"down")+'">'+mv+'</span>':'')+'</div>'+
        '<div class="ir-kind" style="color:'+col+'">'+(KIND_LBL[kind]||kind)+' · '+esc(s.horizon||"")+'</div></div></div>'+
      '<div class="ir-mid"><div class="ir-head">'+esc(s.headline||s.thesis||"")+'</div>'+
        '<div class="ir-meta"><span>'+fmt(s.price)+' → <b>'+fmt(s.target)+'</b></span>'+
        '<span class="ir-conf"><span class="bar"><i style="width:'+(s.conviction||0)+'%;background:'+col+'"></i></span>'+(s.conviction||0)+'%</span></div></div>'+
      '<div class="ir-act">'+
        '<button type="button" class="btn btn-ghost btn-sm" data-paper="'+esc(s.ticker)+'" data-side="buy">Paper</button>'+
        '<button type="button" class="btn btn-ghost btn-sm" data-watch="'+esc(s.ticker)+'">'+(F.Watch&&F.Watch.has(s.ticker)?"★":"☆")+'</button>'+
        '<span class="ir-brief">Brief ›</span>'+
      '</div>';
    return el;
  }
  function lockedRow(n){
    var el = document.createElement("div"); el.className = "glass irow locked reveal";
    el.innerHTML = '<div class="lk"><span class="em">🔒</span><b>'+n+' more idea'+(n===1?"":"s")+' today</b>'+
      '<span>Full briefs, targets & conviction — free with an account.</span>'+
      '<a class="btn btn-primary btn-sm" href="./signin.html?next=ideas.html">Sign in to unlock</a></div>';
    return el;
  }
  function render(d){
    if(!list) return; list.innerHTML = "";
    (d.ideas||[]).forEach(function(s){ list.appendChild(row(s)); });
    var locked = Math.max(0, (d.total||d.ideas.length) - d.ideas.length);
    if(!d.signedIn && locked>0) list.appendChild(lockedRow(locked));
    var cap = $("#f0d59ap"); if(cap && d.day) cap.textContent = "Updated "+d.day+" · "+(d.total||d.ideas.length)+" ideas";
    fit();
  }
  function renderKronos(){
    var K = F.Kronos, picks = K ? K.rank(F.PRICES?Object.keys(F.PRICES):[]).slice(0,6) : [];
    if(!picks.length){ list.innerHTML='<div class="glass irow" style="justify-content:center;grid-template-columns:1fr"><span style="text-align:center;color:var(--text-faint)">Today’s ideas are being prepared — check back shortly, or <a href="./signin.html" style="color:var(--cyan)">sign in</a>.</span></div>'; fit(); return; }
    render({ day:null, total:picks.length, signedIn:true, ideas: picks.map(function(r){ var t=r.ticker,f=K.forecast(t),px=F.priceOf(t),long=r.predReturn>=0;
      return {ticker:t,name:(F.NAMES&&F.NAMES[t])||t,kind:long?"momentum":"rebound",price:px,target:f?f.predClose:px*(1+r.predReturn),conviction:Math.round(r.confidence),horizon:"weeks",
        headline:(long?"Kronos sees upside in ":"Kronos flags risk in ")+t,thesis:"Model estimate from the ensemble.",catalyst:"Model signal.",risk:"Model estimate; markets can move against it."}; }) });
  }

  /* auto fit-to-screen: scale the stack so it never scrolls */
  function fit(){
    var wrap = $(".id-fit"), stack = $("#ideaList");
    if(!wrap || !stack) return;
    stack.style.transform = "scale(1)";
    var availH = wrap.clientHeight, availW = wrap.clientWidth;
    var needH = stack.scrollHeight, needW = stack.scrollWidth;
    if(!needH || !availH) return;
    var scale = Math.min(1, availH/needH, availW/needW);
    scale = Math.max(0.45, scale);
    stack.style.transform = "scale("+scale+")";
  }
  var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt=setTimeout(fit, 120); });
  window.addEventListener("flux-prices", function(){ /* refresh live % without re-fitting layout */
    var q = document.querySelectorAll(".irow[data-brief]");
    q.forEach(function(el){ var t=el.getAttribute("data-brief"), s=IDEAS[t]; if(!s) return; var mv=liveMv(t), sp=el.querySelector(".ir-tk .mv"); if(sp&&mv){ sp.textContent=mv; sp.className="mv "+(mv.indexOf("-")<0?"up":"down"); } });
  });

  /* brief: build / view / download */
  var KIND_NAMES = { momentum:"Momentum", breakout:"Breakout", undervalued:"Undervalued", rebound:"Rebound", overvalued:"Overvalued · caution" };
  function briefLines(s){ if(!s) return []; var mv=liveMv(s.ticker);
    var rows = [["Idea",s.ticker+" — "+(s.name||s.ticker)],["Setup",(KIND_NAMES[s.kind]||"Idea")+" · "+(s.horizon||"")+" horizon"],
      ["Conviction",(s.conviction||0)+"%"],["Price now","$"+(+s.price).toFixed(2)+(mv?(" ("+mv+" today)"):"")]];
    if(s.entry!=null) rows.push(["Entry zone","$"+(+s.entry).toFixed(2)]);
    rows.push(["Directional target","$"+(+s.target).toFixed(2)]);
    if(s.stop!=null) rows.push(["Stop / invalidation","$"+(+s.stop).toFixed(2)]);
    rows.push(["Thesis",s.thesis||""],["Catalyst",s.catalyst||""],["Risk",s.risk||""]);
    if(s.watch) rows.push(["What to watch",s.watch]);
    if(s.news) rows.push(["News used",s.news]);
    return rows; }
  function briefPlain(s){ var out="FLUX — TRADE IDEA BRIEF\n"+(s.headline||"")+"\n"+"=".repeat(44)+"\n\n";
    briefLines(s).forEach(function(r){ out+=r[0].toUpperCase()+":\n"+r[1]+"\n\n"; });
    return out+"-".repeat(44)+"\nSimulated / educational idea on a paper account. Not investment advice; no promise of return or timing. Generated by Fluxi (Flux AI desk).\ndsh-trading.com\n"; }
  function downloadBrief(s){ if(!s) return; try{ var blob=new Blob([briefPlain(s)],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url; a.download="flux-brief-"+s.ticker+".txt"; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },100); if(F.toast) F.toast("⬇️ Downloaded the "+s.ticker+" brief."); }catch(e){} }
  var CURRENT = null;
  function openBrief(s){ if(!s) return; CURRENT = s; var m=$("#briefModal"), body=$("#briefBody"), ttl=$("#briefTitle"); if(!m) return;
    ttl.textContent=s.ticker+" — "+(s.name||s.ticker);
    body.innerHTML='<p class="bm-headline">'+esc(s.headline||"")+'</p>'+briefLines(s).map(function(r){ return '<div class="bm-row"><div class="bm-k">'+esc(r[0])+'</div><div class="bm-v">'+esc(r[1])+'</div></div>'; }).join("")+
      '<p class="bm-disc">Simulated / educational idea on a paper account. Not investment advice; no promise of return or timing.</p>';
    m.classList.add("show"); }
  $("#briefDl").addEventListener("click", function(){ downloadBrief(CURRENT); });
  $("#briefPaper").addEventListener("click", function(){ if(CURRENT) placePaper(CURRENT.ticker, "buy", this); });
  (function(){ var m=$("#briefModal"); m.addEventListener("click", function(ev){ if(ev.target===m || (ev.target.closest&&ev.target.closest("[data-close]"))) m.classList.remove("show"); });
    document.addEventListener("keydown", function(ev){ if(ev.key==="Escape") m.classList.remove("show"); }); })();

  /* actions */
  function placePaper(ticker, side, btn){ var Book=window.FLUXBook; if(!Book||!Book.place){ if(F.toast)F.toast("Paper book unavailable"); return; }
    var px=F.priceOf?F.priceOf(ticker):0, qty=Math.max(1,Math.round(1500/(px||1)));
    var res=Book.place({side:side,ticker:ticker,qty:qty,type:"market"});
    if(res&&res.ok && btn){ btn.textContent="Added"; btn.disabled=true; } }
  function toggleWatch(ticker, btn){ if(!F.Watch||!F.Watch.toggle) return; F.Watch.toggle(ticker); if(btn) btn.textContent=F.Watch.has(ticker)?"★":"☆"; }
  if(list){ list.addEventListener("click", function(ev){
    var g=function(a){ return ev.target.closest?ev.target.closest("["+a+"]"):null; };
    var pb=g("data-paper"); if(pb){ ev.stopPropagation(); placePaper(pb.getAttribute("data-paper"),pb.getAttribute("data-side"),pb); return; }
    var wb=g("data-watch"); if(wb){ ev.stopPropagation(); toggleWatch(wb.getAttribute("data-watch"),wb); return; }
    var br=g("data-brief"); if(br){ openBrief(IDEAS[br.getAttribute("data-brief")]); return; }
  }); }

  list.innerHTML = '<div class="glass irow" style="justify-content:center;grid-template-columns:1fr"><span style="text-align:center;color:var(--text-faint)">Loading today’s ideas…</span></div>';
  if(window.FluxSupa && FluxSupa.tradeIdeas){
    Promise.resolve(FluxSupa.tradeIdeas()).then(function(d){ if(d&&d.ideas&&d.ideas.length) render(d); else renderKronos(); }).catch(renderKronos);
    window.addEventListener("flux-auth", function(){ Promise.resolve(FluxSupa.tradeIdeas()).then(function(d){ if(d&&d.ideas&&d.ideas.length) render(d); }); });
  } else { renderKronos(); }
  setTimeout(fit, 400); setTimeout(fit, 1200);
});
</script>
